<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrugated Graphene PMF Trajectories (L = 200.0)</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #181b24;
      --border-color: #2a2f3d;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    header {
      max-width: 1600px;
      margin: 0 auto 20px auto;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .toolbar {
      position: sticky;
      top: 10px;
      z-index: 100;
      max-width: 1600px;
      margin: 0 auto 24px auto;
      background: rgba(24, 27, 36, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .group-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-right: 4px;
      font-weight: 500;
    }

    button {
      background: #232836;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #2e3547;
      border-color: #4b5563;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .phi-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
    }

    .phi-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .phi-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #60a5fa;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 1100px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .video-card {
      background: #11131a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-label {
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151821;
      border-bottom: 1px solid var(--border-color);
    }

    .filename-tag {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Corrugated Graphene — PMF</h1>
      <div class="subtitle">Parameters: L = 200.0 | Varying h &amp; &theta; across chiral angles &phi; &in; {0&deg;, 15&deg;, 30&deg;, 45&deg;, 60&deg;}</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="btn-group">
      <span class="group-label">Playback:</span>
      <button class="primary" onclick="playAll()">&#9654; Play All</button>
      <button onclick="pauseAll()">&#10074;&#10074; Pause All</button>
      <button onclick="restartAll()">&#8634; Restart</button>
      <button onclick="stepAll(-1)">&#9664; -1 Frame</button>
      <button onclick="stepAll(1)">+1 Frame &#9654;</button>
      <button onclick="syncAll()">&#8644; Sync Times</button>
    </div>

    <div class="btn-group" id="filter-buttons">
      <span class="group-label">Filter &phi;:</span>
      <button class="active" onclick="filterPhi('all', this)">All</button>
      <button onclick="filterPhi(0, this)">0&deg;</button>
      <button onclick="filterPhi(15, this)">15&deg;</button>
      <button onclick="filterPhi(30, this)">30&deg;</button>
      <button onclick="filterPhi(45, this)">45&deg;</button>
      <button onclick="filterPhi(60, this)">60&deg;</button>
    </div>
  </div>

  <div class="container" id="gallery"></div>

  <script>
    const phiValues = [0, 15, 30, 45, 60];
    const properties = [
      { suffix: 'PosZ', label: 'Position.Z (Out-of-plane height)' },
      { suffix: 'Tr_u', label: 'Tr(u) = u_xx + u_yy (Strain Trace)' },
      { suffix: 'B',    label: 'B (Pseudomagnetic Field)' }
    ];

    const gallery = document.getElementById('gallery');

    // Generate HTML cards for all phi and properties
    phiValues.forEach(phi => {
      const section = document.createElement('section');
      section.className = 'phi-section';
      section.dataset.phi = phi;

      const cardsHtml = properties.map(prop => {
        const filename = `fixed_phi_${phi}_${prop.suffix}.mp4`;
        return `
          <div class="video-card">
            <div class="video-label">
              <span>&phi; = ${phi}&deg; &mdash; ${prop.label}</span>
              <span class="filename-tag">${filename}</span>
            </div>
            <video controls loop muted playsinline preload="metadata">
              <source src="${filename}" type="video/mp4">
              Your browser does not support HTML5 video.
            </video>
          </div>
        `;
      }).join('');

      section.innerHTML = `
        <div class="phi-header">
          <div class="phi-title">Angle &phi; = ${phi}&deg;</div>
          <div class="btn-group">
            <button onclick="playRow(${phi})">&#9654; Play Row</button>
            <button onclick="pauseRow(${phi})">&#10074;&#10074; Pause Row</button>
            <button onclick="syncRow(${phi})">&#8644; Sync Row</button>
          </div>
        </div>
        <div class="video-grid">
          ${cardsHtml}
        </div>
      `;

      gallery.appendChild(section);
    });

    function getVisibleVideos() {
      return Array.from(document.querySelectorAll('.phi-section:not([style*="display: none"]) video'));
    }

    function playAll() {
      getVisibleVideos().forEach(v => v.play());
    }

    function pauseAll() {
      getVisibleVideos().forEach(v => v.pause());
    }

    function restartAll() {
      getVisibleVideos().forEach(v => {
        v.currentTime = 0;
      });
    }

    // Since movies are rendered at fps = 1.0, 1 frame = 1.0 second
    function stepAll(deltaSeconds) {
      const vids = getVisibleVideos();
      if (vids.length === 0) return;
      const targetTime = Math.max(0, vids[0].currentTime + deltaSeconds);
      vids.forEach(v => {
        v.pause();
        v.currentTime = targetTime;
      });
    }

    function syncAll() {
      const vids = getVisibleVideos();
      if (vids.length > 0) {
        const refTime = vids[0].currentTime;
        vids.forEach(v => v.currentTime = refTime);
      }
    }

    function playRow(phi) {
      document.querySelectorAll(`.phi-section[data-phi="${phi}"] video`).forEach(v => v.play());
    }

    function pauseRow(phi) {
      document.querySelectorAll(`.phi-section[data-phi="${phi}"] video`).forEach(v => v.pause());
    }

    function syncRow(phi) {
      const vids = document.querySelectorAll(`.phi-section[data-phi="${phi}"] video`);
      if (vids.length > 0) {
        const refTime = vids[0].currentTime;
        vids.forEach(v => v.currentTime = refTime);
      }
    }

    function filterPhi(phi, btn) {
      document.querySelectorAll('#filter-buttons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.phi-section').forEach(sec => {
        if (phi === 'all' || Number(sec.dataset.phi) === phi) {
          sec.style.display = 'block';
        } else {
          sec.style.display = 'none';
          sec.querySelectorAll('video').forEach(v => v.pause());
        }
      });
    }
  </script>
</body>
</html>
